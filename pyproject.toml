[project]
name = "finbyzai"
authors = [
    { name = "Finbyz Tech Pvt Ltd", email = "info@finbyz.tech" }
]
description = "AI-Powered Agents, Tools, and Knowledge Base Platform"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]

dependencies = [
    "langchain~=1.4.7",
    "langchain-core~=1.7.3",
    "langchain-classic~=1.0.8",
    "langchain-community~=0.4.2",
    "langchain-protocol~=0.0.20",

    "langchain-litellm~=0.11.2",
    "litellm>=1.106.6,<2",
    "langchain-google-genai~=4.3.7",
    "langchain-openai~=1.7.3",

    "langchain-chroma~=1.1.0",
    "langchain-pinecone~=0.2.13",
    "langchain-qdrant~=1.1.0",
    "langchain-postgres~=0.0.19",

    "langchain-text-splitters~=1.1.3",

    # 2.x needs google-auth>=2.56; Frappe pins google-auth~=2.48
    "google-genai~=1.68.0",
    "json-schema-to-pydantic~=0.5.0",
    "jsonschema~=4.23",

    "langgraph~=1.2.18",

    "PyMuPDF~=2.0",
    "python-docx~=1.2",
    "markitdown[docx,pptx]~=0.1.9",
    "opentelemetry-proto>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
